[pytest]
pythonpath = .
addopts =
    -p no:cacheprovider
    --html=reports/test-report.html
    --self-contained-html
markers =
    smoke: core demo cases for quick verification
norecursedirs =
    .git
    .pytest_cache
    .pytest-tmp-*
    pytest-tmp
    pytest-cache-files-*
    data
    reports
    third_party
    Cardentify-main
    __pycache__
