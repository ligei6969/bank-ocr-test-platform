<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>审核详情</title>
    <link rel="stylesheet" href="/static/portal/portal.css" />
  </head>
  <body>
    <div class="portal-shell">
      <aside class="sidebar admin-sidebar" aria-label="管理员端导航">
        <a class="brand" href="/admin/reviews">
          <span class="brand-mark" aria-hidden="true">BO</span>
          <span>
            <strong>Bank OCR</strong>
            <small>管理员控制台</small>
          </span>
        </a>
        <nav class="side-nav">
          <a class="nav-item active" href="/admin/reviews" aria-current="page">
            <span class="nav-icon" aria-hidden="true">▦</span>
            审核记录
          </a>
          <a class="nav-item" href="/user">
            <span class="nav-icon" aria-hidden="true">↩</span>
            返回用户端
          </a>
        </nav>
        <form class="logout-form" method="post" action="/logout">
          <button class="logout-button" type="submit">退出登录</button>
        </form>
        <p class="sidebar-note">本地开发与审核演示环境</p>
      </aside>

      <main class="portal-main">
        <header class="page-header">
          <div>
            <p class="eyebrow">REVIEW DETAIL</p>
            <h1>审核详情</h1>
            <p class="page-intro">查看单次影像审核的详细信息。</p>
          </div>
          <a class="text-link" href="/admin/reviews">返回审核记录</a>
        </header>

        <section class="notice warning-notice" aria-label="权限与安全范围提示">
          <strong>权限范围</strong>
          <p>当前页面已限制管理员账号访问，但审核记录接口尚未完成接口级鉴权，仅用于本地开发与演示。</p>
        </section>

        <section class="loading-placeholder" id="adminReviewDetailStatus" role="status" aria-live="polite">
          <span class="empty-icon" aria-hidden="true">○</span>
          <strong id="adminReviewDetailStatusTitle">正在加载审核详情</strong>
          <p id="adminReviewDetailStatusMessage">正在根据 request_id 查询数据库记录。</p>
        </section>

        <div class="detail-grid" id="adminReviewDetailContent" aria-label="审核详情" hidden>
          <section class="content-card detail-card detail-card-wide">
            <h2>基本信息</h2>
            <dl class="admin-detail-list">
              <div><dt>request_id</dt><dd id="detailRequestId"></dd></div>
              <div><dt>证件类型</dt><dd id="detailDocType"></dd></div>
              <div><dt>文件名</dt><dd id="detailFilename"></dd></div>
              <div><dt>OCR 模式</dt><dd id="detailOcrMode"></dd></div>
              <div><dt>创建时间</dt><dd id="detailCreatedAt"></dd></div>
            </dl>
          </section>

          <section class="content-card detail-card">
            <h2>审核结果</h2>
            <dl class="admin-detail-list">
              <div><dt>审核结果</dt><dd id="detailReviewResult"></dd></div>
              <div><dt>质量结果</dt><dd id="detailQualityResult"></dd></div>
              <div><dt>错误信息</dt><dd id="detailErrorMessage"></dd></div>
            </dl>
          </section>

          <section class="content-card detail-card">
            <h2>质量原因</h2>
            <ul class="reason-list" id="detailQualityReasons"></ul>
          </section>

          <section class="content-card detail-card">
            <h2>审核原因</h2>
            <ul class="reason-list" id="detailReviewReasons"></ul>
          </section>

          <section class="content-card detail-card detail-card-wide">
            <h2>解析字段</h2>
            <div class="admin-fields" id="detailFieldsJson"></div>
          </section>
        </div>
      </main>
    </div>
    <script defer src="/static/portal/portal_security.js"></script>
    <script defer src="/static/portal/admin_review_detail.js"></script>
  </body>
</html>
