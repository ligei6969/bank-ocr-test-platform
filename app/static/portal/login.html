<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 银行影像认证中心</title>
    <link rel="stylesheet" href="/static/portal/portal.css" />
    <script src="/static/portal/login.js" defer></script>
  </head>
  <body class="page-login">
    <main class="login-shell">
      <section class="login-brand-panel" aria-labelledby="loginTitle">
        <a class="login-brand" href="/login" aria-label="Bank OCR 登录页">
          <span class="brand-code">BOCR</span>
          <span class="brand-name">影像审核</span>
        </a>
        <div class="login-brand-copy">
          <p class="eyebrow">BANK IMAGE VERIFICATION</p>
          <h1 id="loginTitle">银行影像认证中心</h1>
          <p>登录后进入用户门户，提交银行卡或身份证影像审核。</p>
        </div>
        <p class="login-environment">SECURE USER ACCESS · LOCAL PLATFORM</p>
      </section>

      <section class="login-form-panel" aria-labelledby="loginFormTitle">
        <div class="login-form-wrap">
          <p class="section-number">01 / 用户登录</p>
          <h2 id="loginFormTitle">登录用户门户</h2>
          <p class="login-form-intro">请输入已创建的平台账号信息。</p>

          <p class="login-error" id="loginError" role="alert" hidden></p>

          <form id="loginForm" class="login-form" method="post" action="/login">
            <label for="username">
              <span>用户名</span>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
              />
            </label>
            <label for="password">
              <span>密码</span>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </label>
            <button class="primary-button login-submit" id="loginSubmit" type="submit">
              登录
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
