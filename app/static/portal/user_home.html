<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>银行影像认证中心</title>
    <link rel="stylesheet" href="/static/portal/portal.css" />
  </head>
  <body>
    <div class="portal-shell">
      <aside class="sidebar" aria-label="用户端导航">
        <a class="brand" href="/user">
          <span class="brand-mark" aria-hidden="true">认证</span>
          <span>
            <strong>影像认证</strong>
            <small>影像认证平台</small>
          </span>
        </a>
        <nav class="side-nav">
          <a class="nav-item active" href="/user" aria-current="page">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            业务首页
          </a>
          <a class="nav-item" href="/user/bank-card">
            <span class="nav-icon" aria-hidden="true">▣</span>
            银行卡认证
          </a>
          <a class="nav-item" href="/user/id-card">
            <span class="nav-icon" aria-hidden="true">▤</span>
            身份证认证
          </a>
        </nav>
        <p class="sidebar-note">安全、清晰地完成影像资料认证</p>
      </aside>

      <main class="portal-main">
        <header class="page-header">
          <div>
            <p class="eyebrow">USER PORTAL</p>
            <h1>银行影像认证中心</h1>
            <p class="page-intro">请选择需要办理的认证业务，并按照页面提示上传影像资料。</p>
          </div>
          <span class="header-badge">用户端</span>
        </header>

        <section class="section-heading">
          <div>
            <h2>选择认证业务</h2>
            <p>上传前请确认图片清晰、内容完整。</p>
          </div>
        </section>

        <section class="service-grid" aria-label="认证业务入口">
          <a class="service-card" href="/user/bank-card">
            <span class="service-icon" aria-hidden="true">▣</span>
            <span class="service-copy">
              <strong>银行卡认证</strong>
              <span>上传银行卡图片，提交影像认证申请。</span>
            </span>
            <span class="card-link">进入认证 <span aria-hidden="true">→</span></span>
          </a>

          <a class="service-card" href="/user/id-card">
            <span class="service-icon" aria-hidden="true">▤</span>
            <span class="service-copy">
              <strong>身份证认证</strong>
              <span>上传身份证图片，提交证件审核申请。</span>
            </span>
            <span class="card-link">进入认证 <span aria-hidden="true">→</span></span>
          </a>
        </section>

        <section class="content-card guidance-card">
          <div class="guidance-icon" aria-hidden="true">i</div>
          <div>
            <h2>上传前提示</h2>
            <p>请使用证件原件拍摄，确保画面稳定、边缘完整，并避免遮挡和强光反射。</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
