name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCR_MODE: mock
      # 评测与测试一律离线：Agent 走确定性工具序列，judge 走确定性 rubric。
      # 真实模型只在本地 --live 时调用，CI 里绝不出网。
      LLM_PROVIDER: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Keep minimal image fixtures
        run: |
          find data/processed/bank_card -type f -name "bank_card_*.png" \
            ! -name "bank_card_0001.png" \
            ! -name "bank_card_0002.png" \
            ! -name "bank_card_0003.png" \
            -delete

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: |
          mkdir -p reports
          python -m pytest

      - name: Evaluate AI review against baseline (offline regression gate)
        run: |
          python -m scripts.evaluate_ai_review --calibrate --allure
          # 该命令在指标退化超过容忍度时返回 1，把 CI 打红

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/
          if-no-files-found: ignore

  # 真实 PaddleOCR 的 live 校验。**不参与 push 门禁**，理由有两个：
  #
  # 1. 它会下载模型权重、跑 50 张图，比 pytest 慢一个量级；
  # 2. 更要紧的是，如果 push 门禁依赖现场跑 OCR，那么引擎升版或
  #    Linux/Windows 的浮点差异会让阈值边界样本（blur/glare 附近）
  #    随机翻转，门禁就会随机打红 —— 一个会误报的门禁很快会被无视。
  #
  # 所以门禁走快照回放（上面的 pytest 步骤已经覆盖），真实引擎的差异
  # 由一个独立 job 负责**报警**：它有差异就红，但绝不自动改快照。
  ocr-snapshot-verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ocr-verify]')
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: reports/paddlex-runtime-cache
          key: paddlex-${{ runner.os }}-${{ hashFiles('requirements-paddle.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify the OCR snapshot against a real PaddleOCR run
        run: |
          mkdir -p reports
          # 退出码 1 = 快照与真实行为有差异；快照**不会被覆盖**
          python -m scripts.record_ocr_snapshot --verify
