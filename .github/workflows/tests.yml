name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCR_MODE: mock
      # 评测与测试一律离线：Agent 走确定性工具序列，judge 走确定性 rubric。
      # 真实模型只在本地 --live 时调用，CI 里绝不出网。
      LLM_PROVIDER: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Keep minimal image fixtures
        run: |
          find data/processed/bank_card -type f -name "bank_card_*.png" \
            ! -name "bank_card_0001.png" \
            ! -name "bank_card_0002.png" \
            ! -name "bank_card_0003.png" \
            -delete

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: |
          mkdir -p reports
          python -m pytest

      - name: Evaluate AI review against baseline (offline regression gate)
        run: |
          python -m scripts.evaluate_ai_review --calibrate --allure
          # 该命令在指标退化超过容忍度时返回 1，把 CI 打红

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/
          if-no-files-found: ignore
