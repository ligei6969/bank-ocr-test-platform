name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Keep minimal image fixtures
        run: |
          find data/processed/bank_card -type f -name "bank_card_*.png" \
            ! -name "bank_card_0001.png" \
            ! -name "bank_card_0002.png" \
            ! -name "bank_card_0003.png" \
            -delete

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: |
          mkdir -p reports
          python -m pytest
