<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .band-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .band { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .api { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .service { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .logic { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .data { fill: #fce7f3; stroke: #db2777; stroke-width: 2; }
      .test { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .external { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="50" y="48" class="title">Bank OCR Test Platform Architecture</text>
  <text x="50" y="74" class="subtitle">FastAPI review service, OCR integration, image quality checks, parsers, rules, synthetic data and pytest coverage</text>

  <rect x="40" y="105" width="1320" height="170" rx="8" class="band"/>
  <text x="60" y="135" class="band-title">Entry Points</text>

  <rect x="75" y="160" width="230" height="78" rx="6" class="external"/>
  <text x="95" y="188" class="box-title">Client / Swagger UI</text>
  <text x="95" y="212" class="box-text">Upload image files</text>

  <rect x="390" y="145" width="265" height="108" rx="6" class="api"/>
  <text x="410" y="174" class="box-title">app/main.py</text>
  <text x="410" y="199" class="box-text">POST /bank-card/review</text>
  <text x="410" y="221" class="box-text">POST /id-card/review</text>
  <text x="410" y="243" class="box-text">Returns JSON review payload</text>

  <rect x="735" y="145" width="255" height="108" rx="6" class="api"/>
  <text x="755" y="174" class="box-title">Upload Handling</text>
  <text x="755" y="199" class="box-text">save_upload_file()</text>
  <text x="755" y="221" class="box-text">bank-card validation</text>
  <text x="755" y="243" class="box-text">cleanup temporary upload</text>

  <rect x="1080" y="155" width="230" height="88" rx="6" class="data"/>
  <text x="1100" y="184" class="box-title">reports/tmp_uploads</text>
  <text x="1100" y="208" class="box-text">Short-lived request files</text>

  <path d="M305 199 L390 199" class="arrow"/>
  <path d="M655 199 L735 199" class="arrow"/>
  <path d="M990 199 L1080 199" class="arrow"/>

  <rect x="40" y="310" width="1320" height="250" rx="8" class="band"/>
  <text x="60" y="340" class="band-title">Runtime Review Pipeline</text>

  <rect x="75" y="380" width="220" height="100" rx="6" class="service"/>
  <text x="95" y="409" class="box-title">quality_check.py</text>
  <text x="95" y="434" class="box-text">detect_blur()</text>
  <text x="95" y="456" class="box-text">detect_brightness()</text>
  <text x="95" y="478" class="box-text">detect_glare()</text>

  <rect x="365" y="380" width="230" height="100" rx="6" class="service"/>
  <text x="385" y="409" class="box-title">ocr_service.py</text>
  <text x="385" y="434" class="box-text">PaddleOCR lazy engine</text>
  <text x="385" y="456" class="box-text">recognize_text()</text>
  <text x="385" y="478" class="box-text">normalize OCR output</text>

  <rect x="660" y="350" width="250" height="90" rx="6" class="logic"/>
  <text x="680" y="379" class="box-title">field_parser.py</text>
  <text x="680" y="404" class="box-text">Bank card fields</text>
  <text x="680" y="426" class="box-text">number, date, holder name</text>

  <rect x="660" y="455" width="250" height="82" rx="6" class="logic"/>
  <text x="680" y="484" class="box-title">id_card_parser.py</text>
  <text x="680" y="509" class="box-text">Side detection</text>
  <text x="680" y="531" class="box-text">front/back field parsing</text>

  <rect x="990" y="380" width="235" height="100" rx="6" class="logic"/>
  <text x="1010" y="409" class="box-title">rule_check.py</text>
  <text x="1010" y="434" class="box-text">review_bank_card()</text>
  <text x="1010" y="456" class="box-text">field completeness</text>
  <text x="1010" y="478" class="box-text">quality gates</text>

  <rect x="1250" y="390" width="85" height="80" rx="6" class="api"/>
  <text x="1264" y="421" class="box-title">JSON</text>
  <text x="1262" y="445" class="box-text">review</text>
  <text x="1262" y="466" class="box-text">fields</text>

  <path d="M522 253 C522 300 185 300 185 380" class="arrow"/>
  <path d="M522 253 C522 318 480 318 480 380" class="arrow"/>
  <path d="M595 430 L660 395" class="arrow"/>
  <path d="M595 430 L660 496" class="arrow"/>
  <path d="M295 430 C830 430 840 430 990 430" class="arrow"/>
  <path d="M910 395 L990 430" class="arrow"/>
  <path d="M910 496 L990 430" class="arrow"/>
  <path d="M1225 430 L1250 430" class="arrow"/>

  <rect x="40" y="595" width="640" height="250" rx="8" class="band"/>
  <text x="60" y="625" class="band-title">Data and Generation</text>

  <rect x="75" y="665" width="230" height="96" rx="6" class="data"/>
  <text x="95" y="694" class="box-title">data/synthetic</text>
  <text x="95" y="719" class="box-text">Synthetic bank cards</text>
  <text x="95" y="741" class="box-text">Synthetic ID cards</text>

  <rect x="375" y="650" width="250" height="126" rx="6" class="data"/>
  <text x="395" y="679" class="box-title">data/processed</text>
  <text x="395" y="704" class="box-text">bank_card/normal</text>
  <text x="395" y="726" class="box-text">blur, glare, occlusion</text>
  <text x="395" y="748" class="box-text">rotate, dark, bright</text>

  <rect x="75" y="785" width="230" height="42" rx="6" class="data"/>
  <text x="95" y="812" class="box-title">data/annotations</text>

  <path d="M305 713 L375 713" class="soft-arrow"/>

  <rect x="720" y="595" width="640" height="250" rx="8" class="band"/>
  <text x="740" y="625" class="band-title">Scripts, Diagnostics and Tests</text>

  <rect x="755" y="660" width="250" height="116" rx="6" class="test"/>
  <text x="775" y="689" class="box-title">scripts/</text>
  <text x="775" y="714" class="box-text">generate_synthetic_*.py</text>
  <text x="775" y="736" class="box-text">augment_*.py</text>
  <text x="775" y="758" class="box-text">analyze_quality_distribution.py</text>

  <rect x="1070" y="650" width="245" height="126" rx="6" class="test"/>
  <text x="1090" y="679" class="box-title">tests/</text>
  <text x="1090" y="704" class="box-text">API contract tests</text>
  <text x="1090" y="726" class="box-text">parser tests</text>
  <text x="1090" y="748" class="box-text">quality/rule/OCR tests</text>

  <rect x="910" y="790" width="245" height="42" rx="6" class="data"/>
  <text x="930" y="817" class="box-title">reports/test artifacts</text>

  <path d="M1005 718 L1070 713" class="soft-arrow"/>
  <path d="M880 776 L1032 790" class="soft-arrow"/>
  <path d="M1005 735 C1018 600 185 600 185 480" class="soft-arrow"/>
  <path d="M1192 650 C1192 565 1107 565 1107 480" class="soft-arrow"/>

  <rect x="40" y="880" width="1320" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="910" class="box-title">Review result semantics</text>
  <text x="270" y="910" class="box-text">pass = all required fields and quality pass</text>
  <text x="595" y="910" class="box-text">review = missing fields, bad quality, unknown side, or manual check needed</text>
  <text x="1085" y="910" class="box-text">reject = invalid bank-card number format</text>
</svg>
